openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CSR eligibility application and review API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: applications
    description: CSR eligibility applications
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List CSR applications
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, pending, approved, rejected]
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
    post:
      operationId: createApplication
      tags: [applications]
      summary: Submit a CSR eligibility application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Created application with calculated eligibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Invalid application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /applications/summary:
    get:
      operationId: getApplicationSummary
      tags: [applications]
      summary: Get application summary for administrators
      responses:
        "200":
          description: Application summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationSummary"
  /applications/{id}:
    get:
      operationId: getApplication
      tags: [applications]
      summary: Get one application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /applications/{id}/decision:
    patch:
      operationId: decideApplication
      tags: [applications]
      summary: Approve or reject an application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionInput"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Application:
      type: object
      properties:
        id:
          type: integer
        applicantName:
          type: string
        email:
          type: string
        phone:
          type: string
        age:
          type: ["integer", "null"]
        cityDistrict:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        program:
          type: string
        region:
          type: string
        annualIncome:
          type: ["number", "null"]
        householdSize:
          type: integer
        employmentStatus:
          type: string
        hasDisability:
          type: boolean
        requestedSupport:
          type: string
        reasonForApplying:
          type: ["string", "null"]
        additionalInformation:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        eligibilityScore:
          type: integer
        eligibilityStatus:
          type: string
          enum: [eligible, review, not_eligible]
        status:
          type: string
          enum: [pending, approved, rejected]
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          type: ["string", "null"]
        reviewNote:
          type: ["string", "null"]
      required:
        - id
        - applicantName
        - email
        - phone
        - age
        - cityDistrict
        - state
        - program
        - region
        - annualIncome
        - householdSize
        - employmentStatus
        - hasDisability
        - requestedSupport
        - reasonForApplying
        - additionalInformation
        - notes
        - eligibilityScore
        - eligibilityStatus
        - status
        - submittedAt
        - reviewedAt
        - reviewNote
    ApplicationInput:
      type: object
      properties:
        applicantName:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        phone:
          type: string
          minLength: 7
        age:
          type: integer
          minimum: 0
          maximum: 120
        cityDistrict:
          type: string
          minLength: 2
        state:
          type: string
          minLength: 2
        program:
          type: string
          minLength: 2
        employmentStatus:
          type: string
          enum: [employed, self_employed, unemployed, student, retired]
        reasonForApplying:
          type: string
        additionalInformation:
          type: string
      required:
        - applicantName
        - email
        - phone
        - age
        - cityDistrict
        - state
        - program
        - employmentStatus
    DecisionInput:
      type: object
      properties:
        status:
          type: string
          enum: [approved, rejected]
        reviewNote:
          type: string
      required:
        - status
    ApplicationSummary:
      type: object
      properties:
        total:
          type: integer
        pending:
          type: integer
        approved:
          type: integer
        rejected:
          type: integer
        eligible:
          type: integer
        review:
          type: integer
        notEligible:
          type: integer
      required:
        - total
        - pending
        - approved
        - rejected
        - eligible
        - review
        - notEligible
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error